[package]
name = "ai-stack-desktop"
version = "0.0.3-dev"
edition = "2021"
publish = false

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = {version = "=2.10.3", features = ["unstable"]}
windows = {version = "=0.61.1", features = ["Win32_UI_Shell", "Win32_System_Com"]}
w1-supervisor = { path = "../supervisor" }
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
tauri-build = "=2.5.6"
