name: Windows x64 · PoC Gentle Shell
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['experiments/gentle/**', '.github/workflows/windows-gentle.yml']
permissions:
  contents: read
jobs:
  poc:
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Preparar W1 con versiones y hashes de recuperación
        run: |
          py -3.12 -B experiments/phase1/prepare.py --ci-stage binaries
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          py -3.12 -B experiments/phase1/prepare.py --ci-stage gateway
      - name: Gentle Shell real, gateway y receptores sintéticos
        run: py -3.12 -B experiments/gentle/lab.py
      - name: Conservar sólo el resumen público
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gentle-sintetico-${{ github.run_id }}-${{ github.run_attempt }}
          path: experiments/phase1/.lab/gentle-public.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
