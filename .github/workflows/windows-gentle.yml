name: Windows x64 · Cuentas y entrega GPUI 0.0.6-dev
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  entrega:
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Compilar el supervisor portable MSVC x64
        working-directory: desktop
        run: cargo build --release --locked --target x86_64-pc-windows-msvc -p w1-supervisor --bin ai-stack-gentle
      - name: Preparar el auxiliar oficial Gentle AI para incluirlo en el ZIP
        run: |
          New-Item -ItemType Directory 'entrega-gentle/bin' | Out-Null
          py -3.12 -B desktop/build-gentle-companion.py "$env:RUNNER_TEMP/gai-build" entrega-gentle/bin
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          Copy-Item desktop/target/x86_64-pc-windows-msvc/release/ai-stack-gentle.exe entrega-gentle/bin
      - name: Probar los mismos binarios desde una instalación limpia
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'AI06 ñ'
          New-Item -ItemType Directory "$root/bin" | Out-Null
          Copy-Item entrega-gentle/bin/* "$root/bin"
          .\desktop\ci-cuentas.ps1 -Root $root -Report entrega-gentle/pruebas.txt
      - name: Preparar ZIP por lista permitida
        run: |
          Copy-Item desktop/CUENTAS.md,desktop/gentle-assets.json,experiments/gentle/consent.json,experiments/phase1/versions.json entrega-gentle
          py -3.12 -B desktop/notices.py entrega-gentle/TERCEROS-Rust.txt --gentle
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          Invoke-WebRequest 'https://raw.githubusercontent.com/Gentleman-Programming/gentle-ai/v5.0.0/LICENSE' -OutFile entrega-gentle/LICENSE-GentleAI.txt
          if ((Get-FileHash entrega-gentle/LICENSE-GentleAI.txt).Hash -ne '2806e215dd306b614fe3211e24186652c7d56c1a57340537fc8f2f6822bc74f5') {throw 'Licencia de Gentle AI no coincide'}
          $env:GITHUB_SHA | Set-Content entrega-gentle/commit.txt
          (Get-ChildItem entrega-gentle -File -Recurse | ForEach-Object {"$((Get-FileHash $_.FullName).Hash)  $([IO.Path]::GetRelativePath((Resolve-Path entrega-gentle).Path,$_.FullName))"}) | Set-Content entrega-gentle/SHA256SUMS.txt
      - name: Publicar ZIP portable de prueba
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: AI-Stack-Desktop-0.0.6-dev-win-x64
          path: entrega-gentle/
          if-no-files-found: error
          retention-days: 30
