name: Windows x64 · Desktop 2C y regresión W1
on:
  workflow_dispatch:
    inputs:
      suite:
        type: choice
        description: Alcance del ensayo
        default: completa
        options: [focal, completa]
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-w1.yml'
      - 'experiments/phase1/*.py'
      - 'experiments/phase1/*.json'
      - 'experiments/phase1/peers/**'
      - 'desktop/**'
      - '!desktop/**/*.md'

permissions:
  contents: read
concurrency:
  group: w1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  laboratorio:
    runs-on: windows-2025
    timeout-minutes: 50
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      SUITE: ${{ inputs.suite || 'completa' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false
      - name: Identificar sistema real y Python del runner
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,BuildNumber,OSArchitecture
          py -3.12 -V
      - name: Compilar frontend TypeScript
        working-directory: desktop/frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
      - name: Caché de compilación (sólo crates y target, sin perfiles)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/cache
            desktop/target
          key: desktop-msvc-${{ runner.os }}-${{ hashFiles('desktop/Cargo.lock') }}-${{ github.sha }}
          restore-keys: desktop-msvc-${{ runner.os }}-${{ hashFiles('desktop/Cargo.lock') }}-
      - name: Pruebas unitarias de recuperación y puerto ajeno; compilación EXE MSVC x64
        working-directory: desktop
        run: |
          cargo test --release --locked -p w1-supervisor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --release -p ai-stack-desktop
      - name: Preparación desde cero, recuperación, permisos y ciclo de vida del EXE
        id: setup
        run: |
          $root = Join-Path $PWD.Path 'AI Stack ñ'
          $out = Join-Path $PWD.Path 'evidencia'
          New-Item -ItemType Directory "$root/bin", $out | Out-Null
          Copy-Item desktop/target/release/ai-stack-desktop.exe "$root/bin"
          # La prueba no debe encontrar runtimes o perfiles del runner por PATH.
          $previous = $env:Path
          try {
            $env:Path = "$env:SystemRoot\System32;$env:SystemRoot"
            .\desktop\ci-preparacion.ps1 -Root $root -Output $out
          } finally { $env:Path = $previous }
      - name: Workspace del EXE sobre el servidor supervisado y recuperación tras reinicio
        run: |
          $project = (New-Item -ItemType Directory 'Proyecto CI ñ').FullName
          $report = Join-Path $PWD 'evidencia/workspace.txt'
          $p = Start-Process 'AI Stack ñ/bin/ai-stack-desktop.exe' -ArgumentList @('--ci-workspace', "`"$report`"", "`"$project`"") -PassThru
          if (!$p.WaitForExit(540000)) { $p.Kill(); throw 'Plazo de workspace agotado' }
          Get-Content -LiteralPath $report
          if ($p.ExitCode -ne 0) { throw 'No se superó la integración del workspace' }
      - name: Selector de modelo y esfuerzos en el WebView2 del EXE portable
        timeout-minutes: 10
        run: |
          # Edge navegador/EdgeDriver del runner no sustituyen al runtime Evergreen.
          $bases = @("${env:ProgramFiles(x86)}/Microsoft/EdgeWebView/Application", "$env:LOCALAPPDATA/Microsoft/EdgeWebView/Application")
          $runtime = Get-ChildItem $bases -Recurse -Filter msedgewebview2.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$runtime) {
            $setup = Join-Path $env:RUNNER_TEMP 'WebView2Setup-x64.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/?linkid=2124701' -OutFile $setup
            $sig = Get-AuthenticodeSignature $setup
            if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation,') { throw 'Firma no válida del runtime WebView2' }
            $p = Start-Process $setup -ArgumentList '/silent','/install' -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Instalación WebView2: $($p.ExitCode)" }
            $runtime = Get-ChildItem $bases -Recurse -Filter msedgewebview2.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (!$runtime) { throw 'Runtime WebView2 no encontrado' }
          Write-Host "Runtime WebView2: $($runtime.VersionInfo.ProductVersion)"
          $report = Join-Path $PWD 'evidencia/webview.txt'
          $project = (Resolve-Path 'Proyecto CI ñ').Path
          $p = Start-Process 'AI Stack ñ/bin/ai-stack-desktop.exe' -ArgumentList @('--ci-webview', "`"$report`"", "`"$project`"") -PassThru
          if (!$p.WaitForExit(300000)) { $p.Kill(); throw 'Plazo de WebView2 agotado' }
          Get-Content -LiteralPath $report
          if ($p.ExitCode -ne 0) { throw 'El selector de la UI oficial no pasó' }
      - name: CPA y receptor sintético
        if: ${{ env.SUITE == 'completa' }}
        run: py -3.12 -B experiments/phase1/run.py --hosted-ci --prepared-runtime 'AI Stack ñ/runtimes' --only cpa
      - name: OpenCode independiente
        if: ${{ !cancelled() && env.SUITE == 'completa' && steps.setup.outcome == 'success' }}
        run: py -3.12 -B experiments/phase1/run.py --hosted-ci --prepared-runtime 'AI Stack ñ/runtimes' --only oc
      - name: OmniRoute independiente
        if: ${{ !cancelled() && env.SUITE == 'completa' && steps.setup.outcome == 'success' }}
        run: py -3.12 -B experiments/phase1/run.py --hosted-ci --prepared-runtime 'AI Stack ñ/runtimes' --only omni
      - name: Catálogo del plugin publicado
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          $runtime = 'AI Stack ñ/runtimes'
          $node = (Get-ChildItem "$runtime/node" -Recurse -Filter node.exe).FullName
          py -3.12 -B experiments/phase1/test_plugin.py $node "$runtime/peers"
      - name: Cadena W1, esfuerzos, cola, streaming, cancelación y Jobs
        if: ${{ success() }}
        run: |
          $common = @('--hosted-ci', '--prepared-runtime', 'AI Stack ñ/runtimes')
          if ($env:SUITE -eq 'focal') { py -3.12 -B experiments/phase1/run.py @common --focus }
          else { py -3.12 -B experiments/phase1/run.py @common }
          exit $LASTEXITCODE
      - name: Reducir resultados y métricas a campos públicos
        if: ${{ !cancelled() }}
        run: |
          $flag = @()
          if ('${{ steps.setup.outcome }}' -eq 'success') { $flag += '--sqlite-verified-by-exe' }
          py -3.12 -B experiments/phase1/ci_report.py @flag
      - name: Preparar artifact por lista permitida
        if: ${{ success() && env.SUITE == 'completa' }}
        run: |
          $out = 'entrega'
          New-Item -ItemType Directory "$out/bin" | Out-Null
          Copy-Item 'AI Stack ñ/bin/ai-stack-desktop.exe' "$out/bin/"
          Copy-Item evidencia/backend.txt,evidencia/preparacion-ci.txt,evidencia/workspace.txt,evidencia/webview.txt,desktop/PROBAR.md $out
          Copy-Item desktop/w1.json,experiments/phase1/versions.json $out
          Copy-Item experiments/phase1/.lab/export/informe.json $out
          py -3.12 -B desktop/notices.py "$out/TERCEROS.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:GITHUB_SHA | Set-Content "$out/commit.txt"
          (Get-ChildItem $out -Recurse -File | ForEach-Object { "$((Get-FileHash $_.FullName).Hash)  $([IO.Path]::GetRelativePath((Resolve-Path $out).Path,$_.FullName))" }) | Set-Content "$out/SHA256SUMS.txt"
      - name: ZIP portátil, checksums y evidencia
        if: ${{ success() && env.SUITE == 'completa' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: AI-Stack-Desktop-0.0.4-dev-win-x64
          path: entrega/
          retention-days: 30
          if-no-files-found: error
      - name: Guardar sólo informe sintético
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (node24)
        with:
          name: w1-informe-${{ github.run_id }}-${{ github.run_attempt }}
          path: experiments/phase1/.lab/export/informe.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
